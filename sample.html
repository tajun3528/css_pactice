<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Expanded Website</title>
  <link rel="stylesheet" href="Style/sample.css">
</head>
<body>
  <header>
    <h1>My Expanded Website</h1>


    <nav>
        <a href="#">Home</a> |
        <a href="#">About</a> |
        <a href="#">Services</a> |
        <a href="#">Contact</a>
    </nav>
  </header>

  <main>
    <h2>About This Site</h2>
    <p>This is a simple HTML-only website with extra functions.</p>

    <!-- Image -->
    <h3>Sample Image</h3>
    <div class="image-container">
    <img src="images/birds1.jpg" alt="Placeholder Image">
    <img src="images/birds2.jpg" alt="Placeholder Image">
    <img src="images/birds3.jpg" alt="Placeholder Image">
    </div>
    <!-- Button -->
    <div class="button-container">
      <h3>Click Button</h3>
      <button onclick="alert('Hello! You clicked the button.')">Click Me</button>
    </div>

    <!-- Form -->
    <div class="form-container">
    <h3>Contact Form</h3>
      <form>
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name"><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email"><br><br>

        <input type="submit" value="Submit">
      </form>
    </div>

    <!-- Table -->
    <h3>Sample Table</h3>
    <table border="1">
      <tr>
        <th>Item</th>
        <th>Price</th>
      </tr>
      <tr>
        <td>Apple</td>
        <td>$1</td>
      </tr>
      <tr>
        <td>Banana</td>
        <td>$0.50</td>
      </tr>
    </table>
  </main>

  <footer>
    <p>&copy; 2026 My Expanded Website</p>
  </footer>
</body>
</html>
